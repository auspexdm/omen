<style>
:root{
  --sage:#C9D2B4;
  --sage-deep:#A8B58C;
  --paper:#EFEDE4;
  --card:#FFFFFF;
  --ink:#1A1A18;
  --muted:#7E8377;
  --clay:#B98E6E;
  --rule:#DEDCD0;
  --display:"Caveat",cursive;
  --body:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:120px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;font-weight:300;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---------- Cover ---------- */
.cover{position:relative;padding:54px 22px 44px;text-align:center;background:var(--sage);overflow:hidden}
.leaves{position:absolute;inset:0;opacity:.35;pointer-events:none}
.mark{width:64px;height:64px;margin:0 auto 16px;display:block}
.cover h1{font-family:var(--display);font-weight:700;font-size:clamp(56px,17vw,84px);line-height:.8;margin:0;color:var(--ink);letter-spacing:.01em}
.cover .kicker{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;font-weight:500;color:#54594C;margin-top:12px}
.cover .byline{font-size:12px;color:#54594C;margin-top:6px;font-weight:400}
.cover .tag{font-size:13.5px;color:#4C5145;max-width:330px;margin:18px auto 0;line-height:1.6}

/* ---------- Sticky nav ---------- */
.bar{position:sticky;top:0;z-index:40;background:rgba(239,237,228,.97);border-bottom:1px solid var(--rule)}
.search-wrap{padding:10px 14px 8px}
#search{width:100%;font-family:var(--body);font-size:15px;font-weight:300;padding:11px 15px;border-radius:6px;border:1px solid var(--rule);background:#fff;color:var(--ink)}
#search:focus{outline:2px solid var(--sage-deep);outline-offset:1px;border-color:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 11px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;padding:8px 13px;border-radius:4px;border:1px solid var(--rule);background:#fff;color:#6C7165;text-decoration:none;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- Sections ---------- */
main{max-width:720px;margin:0 auto;padding:0 0 40px}
.sec{padding-top:0}
.band{background:var(--sage);padding:26px 20px 20px;margin-top:26px}
.sec:first-child .band{margin-top:0}
.band h2{font-family:var(--display);font-weight:700;font-size:clamp(40px,10vw,52px);line-height:.85;margin:0;color:var(--ink)}
.band .note{font-size:11.5px;color:#4F5448;margin-top:9px;letter-spacing:.02em}
.body{padding:8px 20px 22px;background:var(--card)}
.grp{padding-top:18px}
.grp-label{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.grp-note{font-size:11.5px;color:var(--clay);margin-bottom:4px}
.item{padding:13px 0;border-bottom:1px solid #EFEEE7}
.line{display:flex;align-items:baseline;gap:12px}
.name{font-size:16px;font-weight:500;color:var(--ink);line-height:1.3;flex:1}
.price{font-size:16px;font-weight:500;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.price.catch{font-size:13px;font-weight:400;color:var(--clay);font-style:italic}
.desc{font-size:12.5px;color:var(--muted);margin-top:5px;max-width:54ch;line-height:1.55;font-weight:300}
.badge{display:inline-block;font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);border:1px solid #E4D3C4;border-radius:3px;padding:2px 6px;margin-left:8px;vertical-align:2px}

/* ---------- Footer ---------- */
footer{background:var(--sage);padding:38px 22px 46px;text-align:center}
footer .thanks{font-family:var(--display);font-weight:700;font-size:46px;color:var(--ink);margin:0 0 8px;line-height:1}
.social{font-size:13px;color:#4C5145;margin-bottom:20px;line-height:1.8}
.social b{font-weight:600}
.notes{max-width:420px;margin:0 auto 22px;font-size:11.5px;color:#565B4E;line-height:1.8}
.contact a{display:block;color:var(--ink);text-decoration:none;font-weight:500;font-size:14px;margin:5px 0}
.addr{font-size:11.5px;color:#565B4E;margin-top:12px;line-height:1.6}
.no-results{padding:50px 20px;text-align:center;color:var(--muted);font-size:14px;background:var(--card)}

/* ---------- Edit mode ---------- */
body.editing .name,body.editing .price,body.editing .desc{outline:1px dashed #C3C8B6;outline-offset:3px;border-radius:2px}
body.editing .desc:empty::before{content:"Add a description";color:#C3C8B6}
body.editing{padding-bottom:96px}
#editbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ink);color:#fff;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:300}
#editbar b{font-weight:600;letter-spacing:.04em}
#editbar .spacer{flex:1}
#editbar button{font-family:var(--body);font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:5px;border:0;background:var(--sage);color:var(--ink);cursor:pointer}
#editbar button.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
.rowtools{display:flex;gap:8px;margin-top:9px}
.rowtools button{font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:#fff;border:1px solid var(--rule);color:#6C7165;padding:5px 10px;border-radius:4px;cursor:pointer}
.addbtn{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px dashed var(--rule);color:#6C7165;padding:10px 14px;border-radius:5px;cursor:pointer;margin-top:14px;width:100%}
</style>
</head>
<body>

<header class="cover">
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <ellipse cx="50" cy="62" rx="26" ry="30" fill="none" stroke="#1A1A18" stroke-width="4.5"/>
    <path d="M50 34 C50 22 54 14 62 9 C62 20 58 28 50 34 Z" fill="#1A1A18"/>
    <path d="M50 44 L50 78" stroke="#1A1A18" stroke-width="3"/>
    <path d="M43 50 L43 74 M57 50 L57 74 M50 48 L50 76" stroke="#1A1A18" stroke-width="2.2"/>
  </svg>
  <h1 id="rname">Mangrove</h1>
  <div class="kicker" id="rkicker">Seafood &amp; Multicuisine</div>
  <div class="byline" id="rbyline"></div>
  <p class="tag" id="rtag"></p>
</header>

<nav class="bar">
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search a dish — prawn, thali, pizza…" aria-label="Search the menu">
  </div>
  <div class="chips" id="chips"></div>
</nav>

<main id="app"></main>

<footer>
  <p class="thanks">Thank you!</p>
  <div class="social" id="social"></div>
  <div class="notes" id="notes"></div>
  <div class="contact" id="contact"></div>
  <div class="addr" id="addr"></div>
</footer>

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('menu-data').textContent);
  var EDIT = /[?&]edit=1/.test(location.search) || location.hash === '#edit';
  var app = document.getElementById('app');
  var chips = document.getElementById('chips');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function isCatch(p){ return /catch|per dish|market/i.test(p||''); }

  document.getElementById('rname').textContent = DATA.restaurant;
  document.getElementById('rkicker').textContent = DATA.kicker;
  document.getElementById('rbyline').textContent = DATA.byline;
  document.getElementById('rtag').textContent = DATA.tagline;
  document.title = DATA.restaurant + ' — Menu | ' + DATA.byline;
  document.getElementById('social').innerHTML =
    'Scan &amp; follow <b>' + esc(DATA.instagram) + '</b><br>Tag us <b>' + esc(DATA.hashtags) + '</b>';
  document.getElementById('notes').innerHTML = (DATA.notes||[]).map(function(n){
    return '<div>'+esc(n)+'</div>'; }).join('');
  document.getElementById('contact').innerHTML =
    '<a href="tel:'+esc((DATA.phone||'').split('/')[0].trim())+'">'+esc(DATA.phone)+'</a>'+
    '<a href="mailto:'+esc(DATA.email)+'">'+esc(DATA.email)+'</a>'+
    '<a href="https://'+esc(DATA.web)+'" target="_blank" rel="noopener">'+esc(DATA.web)+'</a>';
  document.getElementById('addr').textContent = DATA.address;

  function itemHTML(it, si, gi, ii){
    var badge = it.pre ? '<span class="badge">Pre-order</span>' : '';
    var ce = EDIT ? ' contenteditable="true" data-s="'+si+'" data-g="'+gi+'" data-i="'+ii+'"' : '';
    var tools = EDIT ? '<div class="rowtools">'+
      '<button data-act="pre" data-s="'+si+'" data-g="'+gi+'" data-i="'+ii+'">Pre-order</button>'+
      '<button data-act="del" data-s="'+si+'" data-g="'+gi+'" data-i="'+ii+'">Remove</button></div>' : '';
    return '<div class="item" data-name="'+esc((it.n+' '+(it.d||'')).toLowerCase())+'">'+
      '<div class="line">'+
        '<span class="name"'+ce.replace('data-s','data-f="n" data-s')+'>'+esc(it.n)+'</span>'+ badge +
        '<span class="price'+(isCatch(it.p)?' catch':'')+'"'+ce.replace('data-s','data-f="p" data-s')+'>'+
          (isCatch(it.p)?esc(it.p):'\u20B9 '+esc(it.p))+'</span>'+
      '</div>'+
      ((it.d||EDIT)?'<div class="desc"'+ce.replace('data-s','data-f="d" data-s')+'>'+esc(it.d||'')+'</div>':'')+
      tools+'</div>';
  }

  function render(){
    var html = '', nav = '';
    DATA.sections.forEach(function(sec, si){
      nav += '<a class="chip" href="#'+esc(sec.id)+'" data-id="'+esc(sec.id)+'">'+esc(sec.t)+'</a>';
      html += '<section class="sec" id="'+esc(sec.id)+'" data-sec>'+
        '<div class="band"><h2>'+esc(sec.t)+'</h2>'+
        (sec.note?'<div class="note">'+esc(sec.note)+'</div>':'')+'</div><div class="body">';
      sec.groups.forEach(function(g, gi){
        html += '<div class="grp" data-grp>'+
          (g.g?'<div class="grp-label">'+esc(g.g)+'</div>':'')+
          (g.note?'<div class="grp-note">'+esc(g.note)+'</div>':'');
        g.items.forEach(function(it, ii){ html += itemHTML(it, si, gi, ii); });
        if(EDIT) html += '<button class="addbtn" data-act="add" data-s="'+si+'" data-g="'+gi+'">+ Add a dish here</button>';
        html += '</div>';
      });
      html += '</div></section>';
    });
    app.innerHTML = html;
    chips.innerHTML = nav;
    observe();
  }

  document.getElementById('search').addEventListener('input', function(e){
    var q = e.target.value.trim().toLowerCase(), any = false;
    app.querySelectorAll('.item').forEach(function(el){
      var hit = !q || el.dataset.name.indexOf(q) > -1;
      el.style.display = hit ? '' : 'none';
      if(hit) any = true;
    });
    app.querySelectorAll('[data-grp]').forEach(function(g){
      var vis = [].some.call(g.querySelectorAll('.item'), function(i){ return i.style.display !== 'none'; });
      g.style.display = vis ? '' : 'none';
    });
    app.querySelectorAll('[data-sec]').forEach(function(s){
      var vis = [].some.call(s.querySelectorAll('[data-grp]'), function(g){ return g.style.display !== 'none'; });
      s.style.display = vis ? '' : 'none';
    });
    var old = document.querySelector('.no-results'); if(old) old.remove();
    if(!any){
      var d = document.createElement('div');
      d.className = 'no-results';
      d.textContent = 'Nothing on the menu matches that. Try a shorter word.';
      app.appendChild(d);
    }
  });

  var ticking = false;
  function updateActive(){
    ticking = false;
    var bar = document.querySelector('.bar');
    var offset = bar ? bar.offsetHeight : 110;
    document.documentElement.style.scrollPaddingTop = (offset + 4) + 'px';
    var secs = app.querySelectorAll('[data-sec]');
    var active = null;
    for(var i = 0; i < secs.length; i++){
      if(secs[i].style.display === 'none') continue;
      if(secs[i].getBoundingClientRect().top - offset - 8 <= 0) active = secs[i];
    }
    if(!active && secs.length) active = secs[0];
    if(!active) return;
    var changed = false;
    chips.querySelectorAll('.chip').forEach(function(c){
      var on = c.dataset.id === active.id;
      if(on && !c.classList.contains('on')) changed = true;
      c.classList.toggle('on', on);
    });
    if(changed){
      var el = chips.querySelector('.chip.on');
      if(el) chips.scrollLeft = el.offsetLeft - (chips.clientWidth - el.offsetWidth) / 2;
    }
  }
  function queueUpdate(){
    if(!ticking){ ticking = true; requestAnimationFrame(updateActive); }
  }
  window.addEventListener('scroll', queueUpdate, {passive:true});
  window.addEventListener('resize', queueUpdate);
  function observe(){ updateActive(); }

  if(EDIT){
    document.body.classList.add('editing');
    var bar = document.createElement('div');
    bar.id = 'editbar';
    bar.innerHTML = '<b>Editing</b><span>Tap any name, price or note to change it.</span><span class="spacer"></span>'+
      '<button id="dl">Download updated menu</button>'+
      '<button class="ghost" id="exit">View as guest</button>';
    document.body.appendChild(bar);

    app.addEventListener('input', function(e){
      var t = e.target;
      if(!t.dataset || !t.dataset.f) return;
      var it = DATA.sections[t.dataset.s].groups[t.dataset.g].items[t.dataset.i];
      var v = t.textContent.trim();
      if(t.dataset.f === 'p') v = v.replace(/^\u20B9\s*/,'');
      it[t.dataset.f] = v;
    });

    app.addEventListener('click', function(e){
      var b = e.target.closest('button[data-act]');
      if(!b) return;
      var grp = DATA.sections[b.dataset.s].groups[b.dataset.g], i = b.dataset.i;
      if(b.dataset.act === 'add') grp.items.push({n:'New dish', d:'', p:'0'});
      if(b.dataset.act === 'del' && confirm('Remove "'+grp.items[i].n+'" from the menu?')) grp.items.splice(i,1);
      if(b.dataset.act === 'pre') grp.items[i].pre = !grp.items[i].pre;
      render();
    });

    document.getElementById('exit').addEventListener('click', function(){ location.href = location.pathname; });

    document.getElementById('dl').addEventListener('click', function(){
      var clone = document.documentElement.cloneNode(true);
      clone.querySelector('#app').innerHTML = '';
      clone.querySelector('#chips').innerHTML = '';
      var eb = clone.querySelector('#editbar'); if(eb) eb.remove();
      clone.querySelector('body').classList.remove('editing');
      clone.querySelector('#menu-data').textContent = '\n' + JSON.stringify(DATA, null, 2) + '\n';
      var out = '<!DOCTYPE html>\n' + clone.outerHTML;
      var url = URL.createObjectURL(new Blob([out], {type:'text/html'}));
      var a = document.createElement('a');
      a.href = url; a.download = 'index.html'; document.body.appendChild(a); a.click();
      a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    });
  }

  render();
})();
</script>
</body>
</html>
